# Local stack: docker compose up  (copy .env.example to .env first)
name: rentcar

x-app-image: &app-image
  build:
    context: .
    target: runner
  image: rentcar-app:local

services:
  postgres:
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_USER: rentcar_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-INSECURE_DEV_postgres_admin}
      POSTGRES_DB: rentcar
      ROLE_MIGRATOR_PASSWORD: ${ROLE_MIGRATOR_PASSWORD:-INSECURE_DEV_migrator_role}
      ROLE_APP_PASSWORD: ${ROLE_APP_PASSWORD:-INSECURE_DEV_app_role}
      ROLE_BACKUP_PASSWORD: ${ROLE_BACKUP_PASSWORD:-INSECURE_DEV_backup_role}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./db/bootstrap.sql:/rentcar/bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentcar_admin -d rentcar"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *app-image
    command: ["node", "dist-scripts/migrate.mjs"]
    environment:
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-postgres://rentcar_migrator:INSECURE_DEV_migrator_role@postgres:5432/rentcar}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *app-image
    profiles: ["seed"]
    command: ["node", "dist-scripts/seed.mjs"]
    environment:
      APP_ENV: local
      DATABASE_URL: ${DATABASE_URL:-postgres://rentcar_app:INSECURE_DEV_app_role@postgres:5432/rentcar}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:-INSECURE_DEV_password_pepper_change_me_32chars}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.21.8@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
    profiles: ["mail"]
    environment:
      # No reverse DNS on the client: it delays the SMTP greeting by seconds inside Docker.
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  app:
    <<: *app-image
    environment:
      APP_ENV: local
      DATABASE_URL: ${DATABASE_URL:-postgres://rentcar_app:INSECURE_DEV_app_role@postgres:5432/rentcar}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-INSECURE_DEV_encryption_key_change_me_32chars}
      CRON_SECRET: ${CRON_SECRET:-INSECURE_DEV_cron_secret_change_me_32chars_min}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:-INSECURE_DEV_password_pepper_change_me_32chars}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SYSTEM_SMTP_HOST: ${SYSTEM_SMTP_HOST:-mailpit}
      SYSTEM_SMTP_PORT: ${SYSTEM_SMTP_PORT:-1025}
      SYSTEM_SMTP_SECURITY: ${SYSTEM_SMTP_SECURITY:-none}
      SYSTEM_SMTP_FROM_ADDRESS: ${SYSTEM_SMTP_FROM_ADDRESS:-noreply@rentcar.localhost}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:-owner@rentcar.localhost}
      SMTP_DEV_ALLOW_PRIVATE: ${SMTP_DEV_ALLOW_PRIVATE:-true}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
